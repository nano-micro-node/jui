    function renderComponentsEditor() {
      const item = getCurrentEditItem();
      const listEl = document.getElementById('components-editor-list'); 
      if (!item || !listEl) return;
      const useGrid = item.layoutMode === 'grid';
      if (useGrid) {
        listEl.innerHTML = generateGridItemsEditor(item.gridItems || []);
      } else {
        listEl.innerHTML = generateEditorHTML(item.components || [], '');
      }
    }

    function generateGridItemsEditor(gridItems) {
      let html = '';
      (gridItems || []).forEach((gi, giIdx) => {
        html += `
          <div style="border:1px solid var(--border); border-radius:var(--radius-medium); overflow:hidden; margin-bottom:12px; background:var(--card);">
            <div style="display:flex; gap:10px; align-items:center; padding:10px 14px; background:var(--muted); border-bottom:1px solid var(--border);">
              <span style="font-weight:700; font-size:12px; min-width:60px; color:var(--foreground);"><i class="fa-solid fa-table-cells"></i> Item ${giIdx + 1}</span>
              <div style="flex:1;"><label style="font-size:10.5px; font-weight:600;">Col Span (1-12)</label><input type="number" min="1" max="12" value="${gi.colSpan || 6}" oninput="updateWidgetGridItemProp(${giIdx}, 'colSpan', Number(this.value))" style="width:100%; font-size:12px; padding:4px 8px;"></div>
              <div style="flex:1;"><label style="font-size:10.5px; font-weight:600;">Row Span</label><input type="number" min="1" value="${gi.rowSpan || 1}" oninput="updateWidgetGridItemProp(${giIdx}, 'rowSpan', Number(this.value))" style="width:100%; font-size:12px; padding:4px 8px;"></div>
              <button type="button" onclick="toggleWidgetGridItemComponents(${giIdx})" style="padding:5px 10px; font-size:11.5px; font-weight:600;" title="Toggle Components">⚙️ Sub-Components</button>
              <button type="button" onclick="removeWidgetGridItem(${giIdx})" class="danger" style="padding:5px 10px; font-size:11.5px;">✕</button>
            </div>
            <div id="widget-grid-item-comps-${giIdx}" style="display:block; padding:12px; background:var(--faint);">
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${generateEditorHTML(gi.components || [], `gridItems,${giIdx},components`, true, 1)}
              </div>
              <button type="button" onclick="addComponentRow('gridItems,${giIdx},components')" style="width:100%; margin-top:8px; font-size:12px; font-weight:600; padding: 6px;">+ Add Component to Grid Item</button>
            </div>
          </div>
        `;
      });
      html += `<button type="button" onclick="addWidgetGridItem()" style="width:100%; margin-top:6px; font-size:12px; font-weight:600; padding: 8px;">+ Add Grid Item to Widget</button>`;
      return html;
    }

              <div style="display:flex; align-items:center; gap:8px;">
                <span style="background:var(--primary); color:var(--primary-foreground); padding:3px 8px; border-radius:var(--radius-small); font-weight:700; font-size:11px;">
                  <i class="fa-solid fa-layer-group"></i> Nested Div Widget
                </span>
                <span style="font-size:11px; color:var(--muted-foreground); font-family:monospace;">${comp.id || 'div'}</span>
              </div>
              <div style="display:flex; gap:4px; align-items:center;">
                <button type="button" title="Shift Position Up" class="shift-btn" onclick="moveComponent('${currentPath}', -1)">↑ Up</button>
                <button type="button" title="Shift Position Down" class="shift-btn" onclick="moveComponent('${currentPath}', 1)">↓ Down</button>
                <button type="button" title="Remove Nested Div" onclick="removeComponentRow('${currentPath}')" class="danger" style="padding:4px 8px; font-size:12px;">✕</button>
              </div>
            </div>
            <div class="comp-edit-details">${specificInputs}</div>
          </div>`;
        } else {
          html += `
          <div class="comp-edit-card" style="${depth > 0 ? 'padding: 10px; background: var(--card); border-color: var(--border); margin-bottom: 0;' : ''}">
            <div class="comp-edit-top">
              <select style="flex:1; font-weight:600;" onchange="updateCompType('${currentPath}', this.value)">
                <option value="text" ${comp.type==='text'?'selected':''}>Text Block</option>
                <option value="heading" ${comp.type==='heading'?'selected':''}>Heading</option>
                <option value="tag" ${comp.type==='tag'?'selected':''}>Tag/Badge</option>
                <option value="button" ${comp.type==='button'?'selected':''}>Button</option>
                <option value="toggle-btn" ${comp.type==='toggle-btn'?'selected':''}>Toggle Button</option>
                <option value="onoff-group" ${comp.type==='onoff-group'?'selected':''}>On/Off Buttons</option>
                <option value="switch" ${comp.type==='switch'?'selected':''}>Switch Toggle</option>
                <option value="slider" ${comp.type==='slider'?'selected':''}>Slider</option>
                <option value="dual-slider" ${comp.type==='dual-slider'?'selected':''}>Dual Slider</option>
                <option value="circular-slider" ${comp.type==='circular-slider'?'selected':''}>Circular Slider</option>
                <option value="progress-bar" ${comp.type==='progress-bar'?'selected':''}>Progress Bar</option>
                <option value="progress-circle" ${comp.type==='progress-circle'?'selected':''}>Progress Circle</option>
                <option value="card" ${comp.type==='card'?'selected':''}>Card Container</option>
                <option value="div" ${comp.type==='div'?'selected':''}>Nested Div Widget</option>
              </select>
              <div style="display:flex; gap:4px;">
                  <button type="button" title="Shift Position Up" class="shift-btn" onclick="moveComponent('${currentPath}', -1)">↑</button>
                  <button type="button" title="Shift Position Down" class="shift-btn" onclick="moveComponent('${currentPath}', 1)">↓</button>
              </div>
              <button type="button" title="Remove Component" onclick="removeComponentRow('${currentPath}')" class="danger" style="padding:4px 10px;">✕</button>
            </div>
            <div class="comp-edit-details">${specificInputs}</div>
          </div>`;
        }
      });
      return html;
    }

    window.addComponentRow = function(parentPath) { 
      let item = getCurrentEditItem();
      if (!item) return;
      let targetArray;
      if (parentPath === 'root' || !parentPath) {
        if (!item.components) item.components = [];
        targetArray = item.components;
      } else {
        const res = resolvePath(parentPath, item);
        if (Array.isArray(res.target)) {
          targetArray = res.target;
        } else if (res.target && typeof res.target === 'object') {
          if (!res.target.components) res.target.components = [];
          targetArray = res.target.components;
        } else if (Array.isArray(res.container)) {
          targetArray = res.container;
        }
      }
      if (targetArray) {
        targetArray.push({ type: "text", value: "New Custom Text", color: "var(--foreground)", size: "13.5px", align: "left" });
        renderComponentsEditor(); 
      }
    };

    window.removeComponentRow = function(path) { 
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (Array.isArray(res.container) && typeof res.index === 'number') {
        res.container.splice(res.index, 1);
        renderComponentsEditor();
      }
    };

    window.moveComponent = function(path, dir) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (Array.isArray(res.container) && typeof res.index === 'number') {
        const idx = res.index;
        const target = res.container;
        if (idx + dir >= 0 && idx + dir < target.length) {
          let temp = target[idx];
          target[idx] = target[idx + dir];
          target[idx + dir] = temp;
          renderComponentsEditor();
        }
      }
    };

    window.updateCompType = function(path, newType) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (Array.isArray(res.container) && typeof res.index === 'number') {
        let newObj = { type: newType };
        if (newType === 'button') newObj = { type: 'button', label: 'Action', color: 'var(--primary)', width: '100%', href: '', height: 'auto', borderRadius: '', fontSize: '' };
        else if (newType === 'toggle-btn') newObj = { type: 'toggle-btn', label: 'Toggle', active: false, onChange: '' };
        else if (newType === 'onoff-group') newObj = { type: 'onoff-group', labelOn: 'On', labelOff: 'Off', state: 'on', onChange: '' };
        else if (newType === 'switch') newObj = { type: 'switch', label: 'Switch', checked: true, onChange: '' };
        else if (newType === 'slider') newObj = { type: 'slider', label: 'Slider', min: 0, max: 100, value: 50, onChange: '', width: '100%', height: 'auto', trackColor: '', thumbColor: '' };
        else if (newType === 'dual-slider') newObj = { type: 'dual-slider', label: 'Dual Slider', min: 0, max: 100, valueMin: 25, valueMax: 75, onChange: '', width: '100%', height: 'auto', trackColor: '', rangeColor: '', thumbColor: '' };
        else if (newType === 'circular-slider') newObj = { type: 'circular-slider', label: 'Circular Slider', min: 0, max: 100, value: 50, step: 1, unit: '%', onChange: '', size: 120, strokeWidth: 8, trackColor: '', progressColor: '' };
        else if (newType === 'progress-bar') newObj = { type: 'progress-bar', progressType: 'horizontal', label: 'Progress', min: 0, max: 100, value: 50, unit: '%', showValue: true, onChange: '', height: 10, trackColor: '', fillColor: '', borderRadius: '' };
        else if (newType === 'progress-circle') newObj = { type: 'progress-circle', label: 'Progress Circle', min: 0, max: 100, value: 50, unit: '%', showValue: true, onChange: '', size: 100, strokeWidth: 8, trackColor: '', fillColor: '' };
        else if (newType === 'heading') newObj = { type: 'heading', value: 'Heading', level: 3, color: 'var(--foreground)', align: 'left' };
        else if (newType === 'tag') newObj = { type: 'tag', value: 'Tag', variant: 'default', dot: false };
        else if (newType === 'card') newObj = { type: 'card', components: [ { type: 'heading', value: 'Card Title', level: 4, color: 'var(--foreground)', align: 'left' }, { type: 'text', value: 'Card content', color: 'var(--foreground)', size: '13px', align: 'left' }, { type: 'button', label: 'Action', color: 'var(--primary)', width: 'auto', href: '', height: 'auto', borderRadius: '', fontSize: '' } ] };
        else if (newType === 'div') newObj = { type: 'div', id: 'div_' + Date.now(), bg: 'var(--faint)', layoutMode: 'flex', components: [{ type: 'text', value: 'Nested Div Content', color: 'var(--foreground)', size: '13px', align: 'left' }] };
        else newObj = { type: 'text', value: 'Label', color: 'var(--foreground)', size: '13px', align: 'left' };
        
        res.container[res.index] = newObj;
        renderComponentsEditor();
      }
    };

    window.updateCompProp = function(path, prop, val) { 
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (res.target && typeof res.target === 'object') {
        res.target[prop] = val; 
      }
    };

    window.toggleWidgetGridMode = function(mode) {
      if (!currentEditId) return;
      let item = getCurrentEditItem();
      if (!item) return;
      item.layoutMode = mode;
      if (mode === 'grid') {
        if (!item.gridItems || item.gridItems.length === 0) {
          let existingComps = item.components || [{ type: 'text', value: 'Grid Item Content', color: 'var(--foreground)', size: '13.5px', align: 'left' }];
          item.gridItems = [
            { colSpan: 6, rowSpan: 1, components: existingComps.length > 0 ? [existingComps[0]] : [{ type: 'text', value: 'Grid Item 1', color: 'var(--foreground)', size: '13.5px' }] },
            { colSpan: 6, rowSpan: 1, components: [{ type: 'text', value: 'Grid Item 2', color: 'var(--foreground)', size: '13.5px' }] }
          ];
        }
      } else {
        if (item.gridItems) {
          item.components = [];
          item.gridItems.forEach(gi => {
            if (gi.components) item.components.push(...gi.components);
          });
          delete item.gridItems;
        }
      }
      renderComponentsEditor();
    };

    window.toggleDivGridMode = function(path, mode) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (res.target && typeof res.target === 'object') {
        res.target.layoutMode = mode;
        if (mode === 'grid') {
          if (!res.target.gridItems || res.target.gridItems.length === 0) {
            let existingComps = res.target.components || [{ type: 'text', value: 'Grid Item Content', color: 'var(--foreground)', size: '13px', align: 'left' }];
            res.target.gridItems = [
              { colSpan: 6, rowSpan: 1, components: existingComps.length > 0 ? [existingComps[0]] : [{ type: 'text', value: 'Grid Item 1', color: 'var(--foreground)', size: '13px' }] },
              { colSpan: 6, rowSpan: 1, components: [{ type: 'text', value: 'Grid Item 2', color: 'var(--foreground)', size: '13px' }] }
            ];
          }
        } else {
          if (res.target.gridItems) {
            res.target.components = [];
            res.target.gridItems.forEach(gi => {
              if (gi.components) res.target.components.push(...gi.components);
            });
            delete res.target.gridItems;
          }
        }
        renderComponentsEditor();
      }
    };

    window.addGridItem = function(path) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (res.target && typeof res.target === 'object') {
        if (!res.target.gridItems) res.target.gridItems = [];
        res.target.gridItems.push({ 
          colSpan: 4, 
          rowSpan: 1, 
          components: [{ type: 'text', value: 'New Grid Item', color: 'var(--foreground)', size: '13px', align: 'left' }] 
        });
        renderComponentsEditor();
      }
    };

    window.removeGridItem = function(path, gridIdx) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (res.target && res.target.gridItems && gridIdx >= 0 && gridIdx < res.target.gridItems.length) {
        res.target.gridItems.splice(gridIdx, 1);
        renderComponentsEditor();
      }
    };

    window.updateGridItemProp = function(path, gridIdx, prop, val) {
      let item = getCurrentEditItem();
      if (!item) return;
      const res = resolvePath(path, item);
      if (res.target && res.target.gridItems && res.target.gridItems[gridIdx]) {
        res.target.gridItems[gridIdx][prop] = val;
      }
    };

    window.toggleGridItemComponents = function(path, gridIdx) {
      let sanitized = typeof path === 'string' ? path.replace(/,/g, '-') : String(path);
      const el = document.getElementById(`grid-item-comps-${sanitized}-${gridIdx}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    };

    window.updateWidgetGridItemProp = function(gridIdx, prop, val) {
      if (!currentEditId) return;
      const item = getCurrentEditItem();
      if (item && item.gridItems && item.gridItems[gridIdx]) {
        item.gridItems[gridIdx][prop] = val;
      }
    };

    window.addWidgetGridItem = function() {
      const item = getCurrentEditItem();
      if (!item) return;
      if (!item.gridItems) item.gridItems = [];
      item.gridItems.push({
        colSpan: 6,
        rowSpan: 1,
        components: [{ type: 'text', value: 'New Grid Item', color: 'var(--foreground)', size: '13.5px', align: 'left' }]
      });
      renderComponentsEditor();
    };

    window.removeWidgetGridItem = function(giIdx) {
      const item = getCurrentEditItem();
      if (!item || !item.gridItems || giIdx < 0 || giIdx >= item.gridItems.length) return;
      item.gridItems.splice(giIdx, 1);
      renderComponentsEditor();
    };

    window.toggleWidgetGridItemComponents = function(giIdx) {
      const el = document.getElementById(`widget-grid-item-comps-${giIdx}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    };

    window.openAddModal = function() {
      if (isLocked) {
        if (typeof ot !== 'undefined' && ot.toast) {
          ot.toast("Please unlock edit mode first to add a widget.", "Edit Mode Locked", { variant: "warning" });
        }
        return;
      }
      const colInput = document.getElementById('new-colspan');
      if (colInput) {
        colInput.max = getMaxCols();
        colInput.value = Math.min(4, getMaxCols());
      }
      const colLabel = document.getElementById('new-colspan-label');
      if (colLabel) {
        colLabel.innerText = `Width (Column Span: 1 - ${getMaxCols()})`;
      }
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('add-modal').style.display = 'block';
    };

    window.deleteCurrentWidget = function() {
      if (!currentEditId) return;
      if (confirm("Are you sure you want to delete this widget?")) {
        const deletedId = currentEditId;
        editSnapshot = null;
        let cards = getActiveCards().filter(i => i.id !== deletedId);
        setActiveCards(cards);
        saveLayout();
        closeAllModals(true);
        renderUI();
        if (typeof ot !== 'undefined' && ot.toast) {
          ot.toast("Widget deleted successfully!", "Widget Deleted", { variant: "success" });
        }
      }
    };

    window.addWidget = function() {
      const colInput = document.getElementById('new-colspan');
      const colorInput = document.getElementById('new-color');
      const colVal = colInput ? parseInt(colInput.value) || 4 : 4;
      const colorVal = colorInput ? colorInput.value : '#ffffff';
      
      const newWidget = {
        id: 'box_' + Date.now(), 
        colSpan: Math.min(colVal, getMaxCols()), 
        height: "240px", 
        bg: colorVal,
        layoutMode: 'flex',
        components: [
          { type: "heading", value: "New Custom Widget", level: 4, color: "var(--foreground)", align: "left" },
          { type: "text", value: "Configure components inside this widget.", color: "var(--foreground)", size: "13.5px", align: "left" },
          { type: "button", label: "Action Trigger", color: "var(--primary)", width: "100%", href: "" }
        ]
      };
      
      let cards = getActiveCards();
      cards.push(newWidget);
      setActiveCards(cards);
      saveLayout();
      
      closeAllModals(true);
      renderUI();
      
      if (typeof ot !== 'undefined' && ot.toast) {
        ot.toast("New widget successfully added to layout!", "Widget Added", { variant: "success" });
      }
    };

    window.toggleLock = function() {
      isLocked = !isLocked; document.body.classList.toggle('locked', isLocked);
      renderSidebars();
      document.querySelectorAll('.edit-btn').forEach(btn => btn.style.display = isLocked ? 'none' : 'inline-flex');
    };

    window.exportJSON = function() {
      saveLayout();

      if (layoutAdmin && !pageStore['layout_admin']) {
        pageStore['layout_admin'] = layoutAdmin;
      }

      const pageKeys = Object.keys(pageStore);
      if (pageKeys.length === 0) {
        if (typeof ot !== 'undefined' && ot.toast) {
          ot.toast("No pages available to export.", "Export Warning", { variant: "warning" });
        }
        return;
      }

      let count = 0;
      pageKeys.forEach((key, index) => {
        setTimeout(() => {
          const pageData = pageStore[key];
          const filename = (pageData && pageData.page) ? pageData.page : `${key}.json`;
          
          const exportObj = {
            page: filename,
            for: (pageData && pageData.for) ? pageData.for : "admin",
            fatch: (pageData && pageData.fatch) ? pageData.fatch : key,
            leftSidebar: (pageData && pageData.leftSidebar) ? pageData.leftSidebar : { nav: [] },
            rightSidebar: (pageData && pageData.rightSidebar) ? pageData.rightSidebar : { nav: [] },
            cards: (pageData && pageData.cards) ? pageData.cards : { gap: 15, padding: 15, items: [] }
          };

          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
          const downloadAnchor = document.createElement('a');
          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute("download", filename);
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
        }, index * 250);
        count++;
      });

      if (typeof ot !== 'undefined' && ot.toast) {
        ot.toast(`Auto-exporting ${count} separate page files (layout & pages)...`, "Exporting Files", { variant: "success" });
      }
    };

    window.importJSON = function(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      Array.from(files).forEach((file, fIdx) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed || typeof parsed !== 'object') return;

            let fatchId = parsed.fatch || (parsed.page ? parsed.page.replace(/\.json$/i, '') : null);
            if (!fatchId && file.name) {
              fatchId = file.name.replace(/\.json$/i, '');
            }
            if (!fatchId) fatchId = 'page_' + Date.now();

            const normalizedPage = {
              page: parsed.page || (file.name ? file.name : `${fatchId}.json`),
              for: parsed.for || "admin",
              fatch: fatchId,
              leftSidebar: parsed.leftSidebar || { nav: [] },
              rightSidebar: parsed.rightSidebar || { nav: [] },
              cards: parsed.cards || { gap: 15, padding: 15, items: parsed.items || [] }
            };

            if (fatchId === 'layout_admin') {
              layoutAdmin = normalizedPage;
              pageStore['layout_admin'] = layoutAdmin;
              localStorage.setItem('layout_admin_store', JSON.stringify(layoutAdmin));
            } else {
              pageStore[fatchId] = normalizedPage;
              localStorage.setItem(`page_store_${fatchId}`, JSON.stringify(normalizedPage));
              // Merge imported sidebars to layout_admin.json
              mergePageSidebarsToLayout(normalizedPage);
            }

            savePageList();

            if (fIdx === files.length - 1) {
              loadPage(fatchId);
              if (typeof ot !== 'undefined' && ot.toast) {
                ot.toast(`Successfully imported "${normalizedPage.page}". Sidebars updated in layout_admin!`, "Import Successful", { variant: "success" });
              }
            }
          } catch(err) {
            console.error(err);
            if (typeof ot !== 'undefined' && ot.toast) {
              ot.toast("Error parsing JSON file.", "Import Error", { variant: "danger" });
            }
          }
        };
        reader.readAsText(file);
      });
      event.target.value = '';
    };

    /* --- RECURSIVE HTML COMPONENT BUILDER --- */
    function buildComponentsHTML(comps) {
      if (!comps) return '';
      let html = '';
      comps.forEach(comp => {
        if (comp.type === 'text') {
          let color = (!comp.color || comp.color === '#0f172a' || comp.color === '#000000') ? 'var(--foreground)' : comp.color;
          html += `<div class="comp-text" style="color: ${color}; font-size: ${comp.size || '13.5px'}; text-align: ${comp.align || 'left'};">${comp.value || ''}</div>`;
        }
        else if (comp.type === 'heading') {
          const level = comp.level || 3;
          const color = (!comp.color || comp.color === '#0f172a' || comp.color === '#000000') ? 'var(--foreground)' : comp.color;
          const align = comp.align || 'left';
          html += `<h${level} class="comp-heading h${level}" style="color: ${color}; text-align: ${align};">${comp.value || ''}</h${level}>`;
        }
        else if (comp.type === 'tag') {
          const variant = comp.variant || 'default';
          const dot = comp.dot ? 'dot' : '';
          html += `<span class="comp-tag ${variant} ${dot}">${comp.value || 'Tag'}</span>`;
        }
        else if (comp.type === 'button') {
          let bg = (!comp.color || comp.color === '#3b82f6') ? 'var(--primary)' : comp.color;
          let textColor = (bg === 'var(--primary)') ? 'var(--primary-foreground)' : '#ffffff';
          const height = comp.height || 'auto';
          const borderRadius = comp.borderRadius || '';
          const fontSize = comp.fontSize || '';
          html += `<button class="comp-btn" style="background-color: ${bg}; color: ${textColor}; width: ${comp.width || '100%'}; height: ${height}; border-radius: ${borderRadius || 'var(--radius-medium)'}; font-size: ${fontSize || '13px'};" ${comp.href ? `onclick="window.open('${comp.href}', '_blank')"` : `onclick="ot.toast('Action triggered: ${comp.label || 'Button'}', 'Button Action', { variant: 'success' })"`}>${comp.label || 'Button'}</button>`;
        }
        else if (comp.type === 'toggle-btn') html += `<button class="comp-toggle-btn ${comp.active ? 'active' : ''}" onclick="this.classList.toggle('active'); let active = this.classList.contains('active'); ${comp.onChange || ''}">${comp.label || 'Toggle'}</button>`;
        else if (comp.type === 'onoff-group') html += `<div class="comp-onoff-group"><button class="comp-onoff-btn ${comp.state === 'on' ? 'on-active' : ''}" onclick="let g = this.parentElement; g.querySelector('.off-active')?.classList.remove('off-active'); this.classList.add('on-active'); let state='on'; ${comp.onChange || ''}">${comp.labelOn || 'On'}</button><button class="comp-onoff-btn ${comp.state === 'off' ? 'off-active' : ''}" onclick="let g = this.parentElement; g.querySelector('.on-active')?.classList.remove('on-active'); this.classList.add('off-active'); let state='off'; ${comp.onChange || ''}">${comp.labelOff || 'Off'}</button></div>`;
        else if (comp.type === 'switch') html += `<div class="comp-switch-wrapper"><span>${comp.label || 'Switch'}</span><label class="switch"><input type="checkbox" ${comp.checked ? 'checked' : ''} onchange="let checked = this.checked; ${comp.onChange || ''}"><span class="slider-switch"></span></label></div>`;
        else if (comp.type === 'slider') {
          const trackColor = comp.trackColor ? `background: ${comp.trackColor};` : '';
          const thumbColor = comp.thumbColor ? `background: ${comp.thumbColor};` : '';
          const width = comp.width || '100%';
          const height = comp.height || 'auto';
          html += `<div class="comp-slider-group" style="width: ${width};"><div class="comp-slider-header"><span>${comp.label || 'Slider'}</span><span class="slider-val">${comp.value !== undefined ? comp.value : 50}</span></div><input type="range" min="${comp.min !== undefined ? comp.min : 0}" max="${comp.max !== undefined ? comp.max : 100}" value="${comp.value !== undefined ? comp.value : 50}" oninput="this.previousElementSibling.querySelector('.slider-val').innerText = this.value; ${comp.onChange || ''}" style="${trackColor} ${height !== 'auto' ? `height: ${height};` : ''}"></div>`;
        }
        else if (comp.type === 'dual-slider') {
          const min = comp.min !== undefined ? comp.min : 0;
          const max = comp.max !== undefined ? comp.max : 100;
          const valMin = comp.valueMin !== undefined ? comp.valueMin : min + (max - min) * 0.25;
          const valMax = comp.valueMax !== undefined ? comp.valueMax : min + (max - min) * 0.75;
          const trackColor = comp.trackColor ? `background: ${comp.trackColor};` : '';
          const rangeColor = comp.rangeColor ? `background: ${comp.rangeColor};` : '';
          const thumbColor = comp.thumbColor ? `--thumb-color: ${comp.thumbColor};` : '';
          const width = comp.width || '100%';
          const height = comp.height || 'auto';
          const pctMin = ((valMin - min) / (max - min)) * 100;
          const pctMax = ((valMax - min) / (max - min)) * 100;
          html += `<div class="comp-dual-slider-group" style="width: ${width}; ${thumbColor}">
            <div class="comp-dual-slider-header"><span>${comp.label || 'Dual Slider'}</span>
              <div class="dual-slider-vals">
                <span class="dual-slider-val" id="dual-min-${comp.id || '0'}">${valMin}</span>
                <span class="dual-slider-val" id="dual-max-${comp.id || '0'}">${valMax}</span>
              </div>
            </div>
            <div class="dual-slider-track-wrapper">
              <div class="dual-slider-track" style="${trackColor}">
                <div class="dual-slider-range" style="left: ${pctMin}%; width: ${pctMax - pctMin}%; ${rangeColor}"></div>
              </div>
              <input type="range" min="${min}" max="${max}" value="${valMin}" data-role="min" oninput="updateDualSlider(this, '${comp.id || '0'}', '${comp.onChange || ''}')">
              <input type="range" min="${min}" max="${max}" value="${valMax}" data-role="max" oninput="updateDualSlider(this, '${comp.id || '0'}', '${comp.onChange || ''}')">
            </div>
          </div>`;
        }
        else if (comp.type === 'circular-slider') {
          const size = comp.size || 120;
          const strokeWidth = comp.strokeWidth || 8;
          const radius = (size - strokeWidth) / 2;
          const circumference = 2 * Math.PI * radius;
          const min = comp.min !== undefined ? comp.min : 0;
          const max = comp.max !== undefined ? comp.max : 100;
          const value = comp.value !== undefined ? comp.value : 50;
          const progress = (value - min) / (max - min);
          const offset = circumference * (1 - progress);
          const trackColor = comp.trackColor || 'var(--input)';
          const progressColor = comp.progressColor || 'var(--primary)';
          const unit = comp.unit || '';
          html += `<div class="comp-circular-slider" data-id="${comp.id || '0'}">
            <div class="circular-slider-wrapper">
              <svg viewBox="0 0 ${size} ${size}">
                <circle class="circular-slider-bg" cx="${size/2}" cy="${size/2}" r="${radius}" stroke-width="${strokeWidth}" stroke="${trackColor}"/>
                <circle class="circular-slider-progress" cx="${size/2}" cy="${size/2}" r="${radius}" stroke-width="${strokeWidth}" stroke="${progressColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
              </svg>
              <div class="circular-slider-value">
                <div class="val">${value}</div>
                <div class="unit">${unit}</div>
              </div>
            </div>
            <div class="circular-slider-label">${comp.label || 'Circular Slider'}</div>
            <input type="number" class="circular-slider-input" min="${min}" max="${max}" step="${comp.step || 1}" value="${value}" oninput="updateCircularSlider(this, '${comp.id || '0'}', '${comp.onChange || ''}')">
          </div>`;
        }
        else if (comp.type === 'progress-bar') {
          const progressType = comp.progressType || 'horizontal';
          const min = comp.min !== undefined ? comp.min : 0;
          const max = comp.max !== undefined ? comp.max : 100;
          const value = comp.value !== undefined ? comp.value : 50;
          const pct = (max > min) ? Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100)) : 0;
          const trackColor = comp.trackColor || 'var(--input)';
          const fillColor = comp.fillColor || 'var(--primary)';
          const height = comp.height || (progressType === 'vertical' ? 120 : 10);
          const borderRadius = comp.borderRadius || 'var(--radius-full)';
          const unit = comp.unit || '';
          const showValue = comp.showValue !== false;
          
          if (progressType === 'horizontal') {
            html += `<div class="comp-progress-bar horizontal" style="width: 100%;">
              <div class="progress-bar-header"><span>${comp.label || 'Progress'}</span>${showValue ? `<span class="progress-bar-val">${value}${unit ? ' ' + unit : ''}</span>` : ''}</div>
              <div class="progress-bar-track" style="height: ${height}px; background: ${trackColor}; border-radius: ${borderRadius}; width: 100%; overflow: hidden; position: relative;">
                <div class="progress-bar-fill" style="width: ${pct}%; height: 100%; background: ${fillColor}; border-radius: ${borderRadius}; transition: width 0.3s ease;"></div>
              </div>
              ${comp.label ? `<div class="progress-bar-label">${comp.label}</div>` : ''}
            </div>`;
          } else {
            html += `<div class="comp-progress-bar vertical" style="height: ${height}px; width: 60px; display: flex; flex-direction: row; align-items: stretch;">
              <div class="progress-bar-track" style="flex: 1; background: ${trackColor}; border-radius: ${borderRadius}; position: relative; min-height: 100%; overflow: hidden;">
                <div class="progress-bar-fill" style="height: ${pct}%; width: 100%; background: ${fillColor}; border-radius: ${borderRadius}; position: absolute; bottom: 0; left: 0; transition: height 0.3s ease;"></div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 50px; padding: 8px 0;">
                ${showValue ? `<span class="progress-bar-val">${value}${unit ? ' ' + unit : ''}</span>` : ''}
                <span class="progress-bar-label">${comp.label || 'Progress'}</span>
              </div>
            </div>`;
          }
        }
        else if (comp.type === 'progress-circle') {
          const size = comp.size || 100;
          const strokeWidth = comp.strokeWidth || 8;
          const radius = (size - strokeWidth) / 2;
          const circumference = 2 * Math.PI * radius;
          const min = comp.min !== undefined ? comp.min : 0;
          const max = comp.max !== undefined ? comp.max : 100;
          const value = comp.value !== undefined ? comp.value : 50;
          const progress = (max > min) ? Math.min(1, Math.max(0, (value - min) / (max - min))) : 0;
          const offset = circumference * (1 - progress);
          const trackColor = comp.trackColor || 'var(--input)';
          const fillColor = comp.fillColor || 'var(--primary)';
          const unit = comp.unit || '';
          const showValue = comp.showValue !== false;
          html += `<div class="comp-progress-circle">
            <div class="progress-circle-wrapper" style="width: ${size}px; height: ${size}px; position: relative;">
              <svg viewBox="0 0 ${size} ${size}" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                <circle class="progress-circle-bg" cx="${size/2}" cy="${size/2}" r="${radius}" stroke-width="${strokeWidth}" style="stroke: ${trackColor}; fill: none;"/>
                <circle class="progress-circle-fill" cx="${size/2}" cy="${size/2}" r="${radius}" stroke-width="${strokeWidth}" style="stroke: ${fillColor}; stroke-dasharray: ${circumference}; stroke-dashoffset: ${offset}; fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease;"/>
              </svg>
              ${showValue ? `<div class="progress-circle-value"><div class="val">${value}</div>${unit ? `<div class="unit">${unit}</div>` : ''}</div>` : ''}
            </div>
            <div class="progress-circle-label">${comp.label || 'Progress'}</div>
          </div>`;
        }
        else if (comp.type === 'card') {
          html += `<div class="comp-card">`;
          if (comp.components && comp.components.length > 0) {
            // Check if first component is heading - use as title
            const firstComp = comp.components[0];
            if (firstComp && firstComp.type === 'heading') {
              html += `<div class="comp-card-header"><span class="comp-card-title">${firstComp.value || 'Card'}</span></div>`;
              html += `<div class="comp-card-content">${buildComponentsHTML(comp.components.slice(1))}</div>`;
            } else {
              html += `<div class="comp-card-content">${buildComponentsHTML(comp.components)}</div>`;
            }
          }
          html += `<div class="comp-card-footer"></div></div>`;
        }
        else if (comp.type === 'div') {
          let bg = (!comp.bg || comp.bg === '#f8fafc') ? 'var(--faint)' : comp.bg;
          // Check if this div uses grid layout (has gridItems) or simple flex layout
          const useGrid = comp.gridItems && comp.gridItems.length > 0;
          
          if (useGrid) {
            // Render as 12-column grid
            html += `<div class="comp-nested-grid" style="background-color: ${bg}; padding: 8px; border-radius: var(--radius-medium);">`;
            comp.gridItems.forEach((gridItem, idx) => {
              const colSpan = gridItem.colSpan || 6;
              const rowSpan = gridItem.rowSpan || 1;
              const itemId = `grid-item-${comp.id || 'div'}-${idx}`;
              html += `<div class="grid-item" id="${itemId}" style="grid-column: span ${colSpan}; grid-row: span ${rowSpan};" data-grid-index="${idx}">`;
              if (!isLocked) {
                html += `<div class="grid-item-header">
                  <span>Col: ${colSpan}</span>
                  <div class="grid-item-resize-handle" onmousedown="startGridItemResize(event, '${comp.id || 'div'}', ${idx})" ontouchstart="startGridItemResize(event, '${comp.id || 'div'}', ${idx})"></div>
                </div>`;
              }
              html += `<div class="grid-item-content">`;
              if (gridItem.components && gridItem.components.length > 0) {
                html += buildComponentsHTML(gridItem.components);
              }
              html += `</div></div>`;
            });
            html += `</div>`;
          } else {
            // Legacy flex layout
            html += `<div class="comp-nested-div" style="background-color: ${bg};">`;
            if (comp.components && comp.components.length > 0) {
              html += buildComponentsHTML(comp.components);
            } else {
              html += (comp.content || ''); 
            }
            html += `</div>`;
          }
        }
      });
      return html;
    }

    function buildGridHTML(gridItems) {
      if (!gridItems || gridItems.length === 0) return '';
      let html = `<div class="comp-nested-grid" style="padding: 8px; border-radius: var(--radius-medium);">`;
      gridItems.forEach((gridItem, idx) => {
        const colSpan = gridItem.colSpan || 6;
        const rowSpan = gridItem.rowSpan || 1;
        const itemId = `widget-grid-item-${idx}`;
        html += `<div class="grid-item" id="${itemId}" style="grid-column: span ${colSpan}; grid-row: span ${rowSpan};" data-grid-index="${idx}">`;
        if (!isLocked) {
          html += `<div class="grid-item-header">
            <span>Col: ${colSpan}</span>
            <div class="grid-item-resize-handle" onmousedown="startGridItemResize(event, 'widget', ${idx})" ontouchstart="startGridItemResize(event, 'widget', ${idx})"></div>
          </div>`;
        }
        html += `<div class="grid-item-content">`;
        if (gridItem.components && gridItem.components.length > 0) {
          html += buildComponentsHTML(gridItem.components);
        }
        html += `</div></div>`;
      });
      html += `</div>`;
      return html;
    }

    function renderUI() {
      renderSidebars();
      container.innerHTML = "";
      const currentPage = (activePageId === 'layout_admin') ? layoutAdmin : (pageStore[activePageId] || defaultIndexPage);
      const cards = getActiveCards();
      const maxCols = getMaxCols();
      const pageGap = (currentPage && currentPage.cards && currentPage.cards.gap !== undefined) ? currentPage.cards.gap : 15;
      const pagePadding = (currentPage && currentPage.cards && currentPage.cards.padding !== undefined) ? currentPage.cards.padding : 15;
      container.style.gap = pageGap + 'px';

      cards.forEach(item => {
        const el = document.createElement('div'); el.id = item.id; el.className = "dynamic-box";
        el.style.gridColumn = `span ${Math.min(item.colSpan || 4, maxCols)}`;
        
        // STRICT USER SIZING FIX: ONLY USER ACTION SETS BOX HEIGHT (NO AUTOMATIC SIZING)
        el.style.height = item.height || "240px";
        
        el.style.backgroundColor = (item.bg === '#ffffff' || !item.bg) ? 'var(--panel-bg)' : item.bg;
        el.style.padding = pagePadding + 'px';
        if (!isLocked) { el.style.paddingTop = Math.max(pagePadding, 36) + 'px'; }

        let componentsHTML = '';
        if (item.layoutMode === 'grid' && item.gridItems) {
          componentsHTML = buildGridHTML(item.gridItems);
        } else {
          componentsHTML = item.components ? buildComponentsHTML(item.components) : '';
        }

        el.innerHTML = `<button class="edit-btn" style="display: ${isLocked ? 'none' : 'inline-flex'}" onclick="openEditMenu('${item.id}')"><i class="fa-solid fa-gear"></i> Configure</button><div class="widget-content-container">${componentsHTML}</div><div class="overflow-arrow"><i class="fa-solid fa-chevron-down"></i></div><div class="resize-handle-right" onmousedown="initResize(event, '${item.id}', 'right')" ontouchstart="initResize(event, '${item.id}', 'right')"></div><div class="resize-handle-bottom" onmousedown="initResize(event, '${item.id}', 'bottom')" ontouchstart="initResize(event, '${item.id}', 'bottom')"></div>`;
        container.appendChild(el);
      });
      setTimeout(checkOverflowStates, 50);
    }

    window.saveLayout = function() {
      let cards = getActiveCards();
      document.querySelectorAll('#app-container > .dynamic-box').forEach(box => {
        let existingData = cards.find(d => d.id === box.id);
        if (existingData) { existingData.height = box.style.height; }
      });
      const currentPage = (activePageId === 'layout_admin') ? layoutAdmin : pageStore[activePageId];
      if (currentPage) {
        if (activePageId === 'layout_admin') {
          localStorage.setItem('layout_admin_store', JSON.stringify(layoutAdmin));
        } else {
          localStorage.setItem(`page_store_${activePageId}`, JSON.stringify(currentPage));
        }
      }
    };

    window.clearStorage = function() {
      if (confirm("Reset all layouts, pages & sidebars back to defaults?")) {
        localStorage.removeItem('layout_admin_store');
        localStorage.removeItem('page_store_index');
        localStorage.removeItem('active_page_id');
        localStorage.removeItem('page_keys_list');
        const keys = Object.keys(pageStore);
        keys.forEach(k => localStorage.removeItem(`page_store_${k}`));
        localStorage.removeItem('oat-theme');
        pageStore = {};
        layoutAdmin = null;
        initTheme();
        initPages();
        if (typeof ot !== 'undefined' && ot.toast) {
          ot.toast("Dashboard layouts and theme have been reset to defaults.", "Reset Successful", { variant: "success" });
        }
      }
    };

    function checkDeviceChange() {
      const newDevice = getDeviceMode();
      if (newDevice !== activeDevice) {
        saveLayout(); activeDevice = newDevice;
        document.body.className = isLocked ? 'locked' : '';
        document.body.classList.add('device-' + activeDevice);
        if (isLocked) document.body.classList.add('locked');
        renderUI();
      }
    }

    document.body.classList.add('device-' + activeDevice);
    document.body.classList.add('locked');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeAllModals();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        const editModal = document.getElementById('edit-modal');
        if (editModal && editModal.style.display !== 'none') {
          e.preventDefault();
          saveEdit();
        }
      }
    });

    window.addEventListener('resize', () => { checkDeviceChange(); checkOverflowStates(); });
    
    initTheme();
    initPages();
  </script>
</body>
</html>
