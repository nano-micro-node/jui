<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Full-Screen Integrated Dashboard - JSON Driven Sidebars</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #ffffff;
      --sidebar-hover: #1e293b;
      --sidebar-active-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --panel-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
    }

    * { 
      box-sizing: border-box; 
      scrollbar-width: none; 
    }

    *::-webkit-scrollbar {
      display: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
    }

    #app-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* DYNAMIC SIDEBAR STYLES */
    .sidebar {
      width: var(--sidebar-width, 260px);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease;
      z-index: 900;
      flex-shrink: 0;
      height: 100%;
      overflow-y: auto;
      box-shadow: 4px 0 25px rgba(0, 0, 0, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar.collapsed {
      width: 56px !important;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      min-height: 68px;
      flex-shrink: 0;
    }

    .sidebar-logo {
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    .sidebar-logo svg {
      width: 24px;
      height: 24px;
      fill: var(--primary);
      flex-shrink: 0;
    }

    .sidebar.collapsed:not(.mobile-open) .sidebar-logo span,
    .sidebar.collapsed:not(.mobile-open) .nav-text,
    .sidebar.collapsed:not(.mobile-open) .profile-info,
    .sidebar.collapsed:not(.mobile-open) .section-title,
    .sidebar.collapsed:not(.mobile-open) .sidebar-controls-group,
    .sidebar.collapsed:not(.mobile-open) .nav-edit-actions,
    .sidebar.collapsed:not(.mobile-open) .nav-add-btn {
      display: none !important;
    }

    .sidebar.collapsed:not(.mobile-open) .sidebar-logo {
      justify-content: center;
      padding: 0;
      width: 100%;
    }

    .toggle-sidebar-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-sidebar-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .toggle-sidebar-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-nav {
      list-style: none;
      margin: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 0;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
      flex: 1;
    }

    .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
    .nav-item.active { background: var(--sidebar-active-gradient); color: var(--sidebar-text-active); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar.collapsed:not(.mobile-open) .sidebar-header .toggle-sidebar-btn { margin: 0 auto; }
    .sidebar.collapsed:not(.mobile-open) .sidebar-footer { justify-content: center; padding: 15px 0 !important; }

    .sidebar-controls-section {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); margin-bottom: 8px; padding-left: 4px; font-weight: 700; }
    .sidebar-controls-group { display: flex; flex-direction: column; gap: 6px; }

    .sidebar-btn {
      width: 100%; padding: 8px 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03); color: var(--sidebar-text); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px; transition: all 0.2s; position: relative;
    }
    .sidebar-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; flex-shrink: 0; }
    .sidebar-btn:hover { background: var(--sidebar-hover); color: #fff; border-color: rgba(255, 255, 255, 0.15); }
    .sidebar-btn.primary { background: var(--primary); color: #fff; border-color: transparent; }
    .sidebar-btn.primary:hover { background: #2563eb; }
    .sidebar-btn.danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .sidebar-btn.danger:hover { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }

    .device-indicator { background: rgba(255, 255, 255, 0.04); padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.06); }

    .sidebar-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }

    .profile-img { width: 38px; height: 38px; border-radius: 50%; background: #334155; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
    .profile-info { font-size: 13px; overflow: hidden; }
    .profile-name { font-weight: 600; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .profile-role { font-size: 11px; color: var(--sidebar-text); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

    /* DASHBOARD CONTENT */
    #dashboard-main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; overflow-y: auto; position: relative; }
    #mobile-top-bar { display: none; padding: 10px 16px; background: var(--sidebar-bg); color: white; align-items: center; justify-content: space-between; min-height: 56px; flex-shrink: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    #mobile-top-bar strong { font-size: 15px; letter-spacing: -0.2px; }
    #app-container { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(2px, auto); grid-auto-flow: dense; padding: 5px; width: 100%; transition: gap 0.2s ease; }

    body.device-tablet #app-container { grid-template-columns: repeat(8, 1fr); }
    body.device-mobile #app-container { grid-template-columns: repeat(4, 1fr); }

    .dynamic-box {
      position: relative; overflow: auto; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; color: #1e293b; font-weight: 600; cursor: grab; user-select: none; touch-action: none; background-color: white; min-height: 2px; box-sizing: border-box; transition: box-shadow 0.2s ease; gap: 8px;
    }
    .dynamic-box:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04); }
    .dynamic-box:active { cursor: grabbing; }
    .locked .dynamic-box { cursor: default; }
    .dynamic-box.dragging { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.85; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); transform: scale(1.02) rotate(-1deg); }

    .widget-content-container { display: flex; flex-direction: column; gap: 8px; width: 100%; height: 100%; margin-top: 24px; }
    .comp-text { word-break: break-word; width: 100%; }
    .comp-btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; text-align: center; text-decoration: none; display: inline-block; }
    .comp-btn:hover { opacity: 0.9; }
    .comp-toggle-btn { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: #f1f5f9; color: #475569; transition: all 0.2s; text-align: center; }
    .comp-toggle-btn.active { background: var(--primary); color: #ffffff; border-color: transparent; }
    .comp-onoff-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
    .comp-onoff-btn { flex: 1; padding: 6px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; background: #f8fafc; color: #64748b; transition: all 0.2s; text-align: center; }
    .comp-onoff-btn.on-active { background: #10b981; color: #fff; }
    .comp-onoff-btn.off-active { background: #ef4444; color: #fff; }
    .comp-switch-wrapper { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #334155; border: 1px solid var(--border-color); }
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-switch { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 20px; }
    .slider-switch:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-switch { background-color: var(--primary); }
    input:checked + .slider-switch:before { transform: translateX(18px); }
    .comp-slider-group { display: flex; flex-direction: column; gap: 4px; background: #f1f5f9; padding: 8px; border-radius: 8px; font-size: 11px; color: #475569; }
    .comp-slider-group input[type="range"] { width: 100%; cursor: pointer; }
    .comp-nested-div { border: 1px dashed var(--border-color); padding: 8px; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }

    .overflow-arrow { position: absolute; bottom: 6px; right: 8px; font-size: 10px; background: rgba(0, 0, 0, 0.08); color: #475569; padding: 2px 6px; border-radius: 4px; display: none; pointer-events: none; z-index: 15; font-weight: bold; }
    .dynamic-box.has-overflow .overflow-arrow { display: block; }

    .resize-handle-right { position: absolute; right: 0; top: 0; bottom: 0; width: 12px; cursor: ew-resize; z-index: 20; background: transparent; }
    .resize-handle-right:hover { background: rgba(59, 130, 246, 0.15); }
    .resize-handle-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; cursor: ns-resize; z-index: 20; background: transparent; }
    .resize-handle-bottom:hover { background: rgba(59, 130, 246, 0.15); }
    .locked .resize-handle-right, .locked .resize-handle-bottom { display: none; }

    .placeholder { border: 2px dashed var(--primary); background: rgba(59, 130, 246, 0.05); border-radius: 12px; box-sizing: border-box; transition: all 0.2s; }
    .edit-btn { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 500; padding: 3px 8px; cursor: pointer; background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border-color); border-radius: 6px; z-index: 10; color: #475569; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: all 0.2s; }
    .edit-btn:hover { background: #fff; color: #1e293b; border-color: #cbd5e1; }
    .is-dragging * { user-select: none !important; }

    /* MODALS */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 99999; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 18px; box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.15), 0 15px 15px -5px rgba(0, 0, 0, 0.06); z-index: 100000; width: 720px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); }
    .modal h3 { margin-top: 0; font-size: 20px; color: #0f172a; margin-bottom: 20px; font-weight: 700; }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; margin-bottom: 6px; font-weight: 600; color: #475569; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group input[type="color"], .form-group select { padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s; background: #fff; }
    .form-group input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--primary); }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    
    .components-editor-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
    .comp-edit-card { background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
    .comp-edit-top { display: flex; gap: 10px; align-items: center; }
    .comp-edit-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; }
    .comp-edit-details .full-w { grid-column: span 2; }
    .comp-edit-details label { font-size: 11px; margin-bottom: 3px; color: #64748b; font-weight: 600; }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border-color); }
    .modal-actions-right { display: flex; gap: 10px; }
    .modal button { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border-color); background: #f8fafc; color: #334155; transition: all 0.2s; }
    .modal button:hover { background: #f1f5f9; }
    .modal button.primary { background: var(--primary); color: white; border-color: transparent; }
    .modal button.primary:hover { background: #2563eb; }
    .modal button.danger { background: #fef2f2; color: #dc2626; border-color: #fee2e2; }
    .modal button.danger:hover { background: #fee2e2; }

    #global-tooltip { position: fixed; display: none; background: #1e293b; color: #ffffff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; z-index: 999999; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); }

    @media (max-width: 768px) {
      #mobile-top-bar { display: flex; }
      #app-wrapper { flex-direction: column; height: 100vh; }
      .sidebar { position: fixed; top: 56px; bottom: 0; width: var(--sidebar-width, 260px) !important; height: calc(100vh - 56px); z-index: 1100; }
      .sidebar.collapsed { width: var(--sidebar-width, 260px) !important; }
      #left-sidebar { left: 0; transform: translateX(-100%); }
      #left-sidebar.mobile-open { transform: translateX(0); }
      #right-sidebar { right: 0; transform: translateX(100%); }
      #right-sidebar.mobile-open { transform: translateX(0); }
    }
  </style>
</head>
<body class="device-desktop locked">

  <div id="global-tooltip"></div>
  
  <input type="file" id="import-file" style="display: none" accept=".json" onchange="importJSON(event)">

  <div id="mobile-top-bar">
    <button class="toggle-sidebar-btn" onclick="toggleLeftSidebar()" title="Toggle Menu">
      <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <strong>TTS IOT</strong>
    <button class="toggle-sidebar-btn" onclick="toggleRightSidebar()" title="Toggle Tools">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div id="app-wrapper">
    <aside id="left-sidebar" class="sidebar collapsed"></aside>

    <main id="dashboard-main">
      <div id="app-container"></div>
    </main>

    <aside id="right-sidebar" class="sidebar collapsed"></aside>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeAllModals()"></div>

  <!-- EDIT WIDGET MODAL -->
  <div class="modal" id="edit-modal">
    <h3>Configure Widget & Components</h3>
    <div class="form-group"><label>Width (Column Span)</label><input type="number" id="edit-colspan" min="1" max="12"></div>
    <div class="form-group"><label>Widget Background Color</label><input type="color" id="edit-color"></div>
    <div class="form-group">
      <label>Component Customization Suite</label>
      <div id="components-editor-list" class="components-editor-list"></div>
      <button type="button" onclick="addComponentRow('root')" style="width:100%; margin-top:6px;">+ Add Component</button>
    </div>
    <div class="modal-actions">
      <button onclick="deleteCurrentWidget()" class="danger">Remove Widget</button>
      <div class="modal-actions-right">
        <button onclick="closeAllModals()">Cancel</button>
        <button onclick="saveEdit()" class="primary">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="modal" id="add-modal">
    <h3>Add New Multi-Component Widget</h3>
    <div class="form-group"><label id="new-colspan-label">Width (Column Span)</label><input type="number" id="new-colspan" min="1" max="12" value="4"></div>
    <div class="form-group"><label>Background Color</label><input type="color" id="new-color" value="#ffffff"></div>
    <div class="modal-actions" style="justify-content: flex-end;">
      <div class="modal-actions-right">
        <button onclick="closeAllModals()">Cancel</button>
        <button onclick="addWidget()" class="primary">Create</button>
      </div>
    </div>
  </div>

  <!-- NAV ITEM EDIT/ADD MODAL -->
  <div class="modal" id="nav-item-modal">
    <h3 id="nav-modal-title">Configure Navigation Item</h3>
    <div class="form-group"><label>Item Title</label><input type="text" id="nav-input-title"></div>
    <div class="form-group"><label>Link URL (optional)</label><input type="text" id="nav-input-href" placeholder="https://..."></div>
    <div class="modal-actions" style="justify-content: flex-end;">
      <div class="modal-actions-right">
        <button onclick="closeAllModals()">Cancel</button>
        <button onclick="saveNavItem()" class="primary">Save Nav Item</button>
      </div>
    </div>
  </div>

  <!-- EXTENDED LAYOUT SETTINGS MODAL -->
  <div class="modal" id="layout-settings-modal">
    <h3>Layout Settings (<span id="settings-device-name">Desk</span>)</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <div class="form-group">
        <label>Grid Gap (<span id="gap-val">20</span>px)</label>
        <input type="range" id="setting-gap" min="0" max="50" value="20" oninput="updateGapPreview(this.value)">
      </div>
      <div class="form-group">
        <label>Widget Padding (<span id="padding-val">18</span>px)</label>
        <input type="range" id="setting-padding" min="0" max="40" value="18" oninput="updatePaddingPreview(this.value)">
      </div>
      <div class="form-group">
        <label>Sidebar Width (<span id="sb-width-val">260</span>px)</label>
        <input type="range" id="setting-sb-width" min="150" max="400" value="260" oninput="updateSbWidthPreview(this.value)">
      </div>
      <div class="form-group">
        <label>Sidebar Padding (<span id="sb-padding-val">12</span>px)</label>
        <input type="range" id="setting-sb-padding" min="0" max="30" value="12" oninput="updateSbPaddingPreview(this.value)">
      </div>
    </div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:16px 0;">
    <div class="form-group">
      <label>Copy Layout Configuration From Another Device</label>
      <div style="display: flex; gap: 10px;">
        <select id="copy-source-device" style="flex: 1;">
          <option value="desktop">Desktop</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile</option>
        </select>
        <button type="button" onclick="executeLayoutCopy()" style="white-space: nowrap;">Copy to Current</button>
      </div>
    </div>
    <div class="modal-actions" style="justify-content: flex-end;">
      <div class="modal-actions-right">
        <button onclick="closeAllModals()">Cancel</button>
        <button onclick="saveLayoutSettings()" class="primary">Save & Apply</button>
      </div>
    </div>
  </div>

  <script>
    const globalTooltip = document.getElementById('global-tooltip');
    document.addEventListener('mouseover', (e) => {
      const target = e.target.closest('[data-tooltip]');
      const sidebar = target ? target.closest('.sidebar') : null;
      if (target && sidebar && sidebar.classList.contains('collapsed') && window.innerWidth > 768) {
        const text = target.getAttribute('data-tooltip');
        if (text) {
          globalTooltip.innerText = text;
          globalTooltip.style.display = 'block';
          const rect = target.getBoundingClientRect();
          globalTooltip.style.left = (rect.right + 12) + 'px';
          globalTooltip.style.top = (rect.top + (rect.height / 2)) + 'px';
          globalTooltip.style.transform = 'translateY(-50%)';
        }
      }
    });
    document.addEventListener('mouseout', (e) => {
      const target = e.target.closest('[data-tooltip]');
      if (target) { globalTooltip.style.display = 'none'; }
    });

    function toggleLeftSidebar() {
      const sidebar = document.getElementById('left-sidebar');
      if (window.innerWidth <= 768) { sidebar.classList.toggle('mobile-open'); } 
      else { sidebar.classList.toggle('collapsed'); }
    }

    function toggleRightSidebar() {
      const sidebar = document.getElementById('right-sidebar');
      if (window.innerWidth <= 768) { sidebar.classList.toggle('mobile-open'); } 
      else { sidebar.classList.toggle('collapsed'); }
    }

    const baseLeftSidebar = {
      width: 260, padding: 12,
      header: { title: "TTS IOT", icon: "<svg viewBox=\"0 0 24 24\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"></polygon></svg>" },
      nav: [
        { title: "Dashboard", icon: "<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\"></rect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\"></rect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\"></rect></svg>", active: true },
        { title: "Users", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path><circle cx=\"9\" cy=\"7\" r=\"4\"></circle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"></path><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"></path></svg>" },
        { title: "Messages", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path></svg>" },
        { title: "Analytics", icon: "<svg viewBox=\"0 0 24 24\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"></line><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"></line><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"></line></svg>" },
        { title: "File Manager", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"></path></svg>" },
        { title: "Orders", icon: "<svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg>" }
      ],
      controlsTitle: "Manager",
      controls: [
        { title: "Add Widget", icon: "<svg viewBox=\"0 0 24 24\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"></line><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line></svg>", action: "openAddModal()", style: "primary" },
        { title: "Layout Settings", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-8V3M1 14h6m2-6h6m2 8h6\"></path></svg>", action: "openLayoutSettingsModal()" },
        { id: "lock-btn", title: "Unlock Layout", icon: "", action: "toggleLock()" },
        { title: "Export JSON", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><polyline points=\"7 10 12 15 17 10\"></polyline><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"></line></svg>", action: "exportJSON()" },
        { title: "Import JSON", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><polyline points=\"17 8 12 3 7 8\"></polyline><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"></line></svg>", action: "document.getElementById('import-file').click()" },
        { title: "Reset Layouts", icon: "<svg viewBox=\"0 0 24 24\"><polyline points=\"1 4 1 10 7 10\"></polyline><path d=\"M3.51 15a9 9 0 1 0 2.13-9.36L1 10\"></path></svg>", action: "clearStorage()", style: "danger" }
      ],
      profile: {
        name: "Sangmeshwar",
        role: "Drive Test Engineer",
        img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100"
      }
    };

    const baseRightSidebar = {
      width: 260, padding: 12,
      header: { title: "Tools" },
      nav: [
        { title: "Notifications (3)", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path></svg>" },
        { title: "Dark Theme", icon: "<svg viewBox=\"0 0 24 24\"><path d=\"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\"></path></svg>" },
        { title: "Security Log", icon: "<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"></rect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"></path></svg>" },
        { title: "Cache Clear", icon: "<svg viewBox=\"0 0 24 24\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"></polygon></svg>" }
      ]
    };

    const defaultMultiLayouts = {
      leftSidebar: JSON.parse(JSON.stringify(baseLeftSidebar)),
      rightSidebar: JSON.parse(JSON.stringify(baseRightSidebar)),
      
      desktop: { gap: 20, padding: 18, items: [
        { id: "box_1", colSpan: 6, height: "230px", bg: "#ffffff", components: [ { type: "text", value: "Centered Control Panel", color: "#0f172a", size: "14px", align: "center" }, { type: "button", label: "Open Docs / Link", color: "#3b82f6", href: "https://github.com", width: "100%" }, { type: "slider", label: "Master Intensity", min: 0, max: 100, value: 75, onChange: "" } ] },
        { id: "box_2", colSpan: 6, height: "230px", bg: "#ffffff", components: [ { type: "text", value: "Switch & States Suite", color: "#0f172a", size: "14px", align: "left" }, { type: "switch", label: "System Power Mode", checked: true, onChange: "" } ] }
      ]},
      tablet: { gap: 16, padding: 16, items: [
        { id: "box_1", colSpan: 8, height: "190px", bg: "#ffffff", components: [ { type: "text", value: "Main Control Panel", color: "#0f172a", size: "14px", align: "center" }, { type: "button", label: "Power", color: "#3b82f6", href: "", width: "100%" } ] }
      ]},
      mobile: { gap: 12, padding: 12, items: [
        { id: "box_1", colSpan: 4, height: "180px", bg: "#ffffff", components: [ { type: "text", value: "Main Panel", color: "#0f172a", size: "13px", align: "center" }, { type: "button", label: "Run", color: "#3b82f6", href: "", width: "100%" } ] }
      ]}
    };

    const STORAGE_KEY = "fullscreen_sidebar_custom_components_layouts_v6";
    let layouts = JSON.parse(JSON.stringify(defaultMultiLayouts));
    let rawStored = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (rawStored) {
      layouts.leftSidebar = rawStored.leftSidebar || JSON.parse(JSON.stringify(baseLeftSidebar));
      layouts.rightSidebar = rawStored.rightSidebar || JSON.parse(JSON.stringify(baseRightSidebar));

      ['desktop', 'tablet', 'mobile'].forEach(dev => {
        if (rawStored[dev]) {
          layouts[dev] = {
            gap: rawStored[dev].gap !== undefined ? rawStored[dev].gap : defaultMultiLayouts[dev].gap,
            padding: rawStored[dev].padding !== undefined ? rawStored[dev].padding : defaultMultiLayouts[dev].padding,
            items: rawStored[dev].items || defaultMultiLayouts[dev].items
          };
        }
      });
    }

    let isLocked = true;
    const container = document.getElementById("app-container");

    function getDeviceMode() {
      const width = window.innerWidth;
      if (width <= 640) return 'mobile';
      if (width <= 1024) return 'tablet';
      return 'desktop';
    }

    let activeDevice = getDeviceMode();

    /* --- SIDEBAR NAV EDITING STATE --- */
    let currentNavEditSide = null;
    let currentNavEditIndex = null;

    window.openAddNavModal = function(side) {
      currentNavEditSide = side;
      currentNavEditIndex = null;
      document.getElementById('nav-modal-title').innerText = "Add Navigation Item (" + side + ")";
      document.getElementById('nav-input-title').value = "";
      document.getElementById('nav-input-href').value = "";
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('nav-item-modal').style.display = 'block';
    }

    window.openEditNavModal = function(side, index) {
      currentNavEditSide = side;
      currentNavEditIndex = index;
      const item = layouts[side === 'left' ? 'leftSidebar' : 'rightSidebar'].nav[index];
      document.getElementById('nav-modal-title').innerText = "Edit Navigation Item";
      document.getElementById('nav-input-title').value = item.title || "";
      document.getElementById('nav-input-href').value = item.href || "";
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('nav-item-modal').style.display = 'block';
    }

    window.saveNavItem = function() {
      if (!currentNavEditSide) return;
      const title = document.getElementById('nav-input-title').value.trim();
      const href = document.getElementById('nav-input-href').value.trim();
      if (!title) { alert("Title is required"); return; }
      
      const navList = layouts[currentNavEditSide === 'left' ? 'leftSidebar' : 'rightSidebar'].nav;
      const defaultIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle></svg>';

      if (currentNavEditIndex === null) {
        navList.push({ title, icon: defaultIcon, href: href || undefined });
      } else {
        navList[currentNavEditIndex].title = title;
        navList[currentNavEditIndex].href = href || undefined;
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts));
      renderSidebars();
      closeAllModals();
    }

    window.deleteNavItem = function(side, index) {
      if (confirm("Delete this navigation item?")) {
        const navList = layouts[side === 'left' ? 'leftSidebar' : 'rightSidebar'].nav;
        navList.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts));
        renderSidebars();
      }
    }

    /* --- SIDEBAR RENDERING SYSTEM --- */
    function renderSidebars() {
      const left = layouts.leftSidebar;
      const right = layouts.rightSidebar;
      
      const leftAside = document.getElementById('left-sidebar');
      const rightAside = document.getElementById('right-sidebar');

      leftAside.style.setProperty('--sidebar-width', left.width + 'px');
      leftAside.style.setProperty('--sb-pad', left.padding + 'px');
      rightAside.style.setProperty('--sidebar-width', right.width + 'px');
      rightAside.style.setProperty('--sb-pad', right.padding + 'px');

      leftAside.innerHTML = `
        <div class="sidebar-header" style="padding: var(--sb-pad) 10px;">
          <span class="sidebar-logo">
            ${left.header.icon}
            <span>${left.header.title}</span>
          </span>
          <button class="toggle-sidebar-btn" onclick="toggleLeftSidebar()" title="Expand Menu">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <ul class="sidebar-nav" style="padding: var(--sb-pad);">
          ${left.nav.map((n, idx) => `
            <li style="display: flex; align-items: center; gap: 4px;">
              <a href="#" class="nav-item ${n.active?'active':''}" data-tooltip="${n.title}" ${n.href ? `onclick="window.open('${n.href}', '_blank'); return false;"` : ''}>
                <span class="nav-icon">${n.icon}</span>
                <span class="nav-text">${n.title}</span>
              </a>
              ${!isLocked ? `
                <div class="nav-edit-actions" style="display: flex; gap: 2px;">
                  <button onclick="openEditNavModal('left', ${idx})" style="background: rgba(255,255,255,0.08); border: none; color: #cbd5e1; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 11px;" title="Edit">✏️</button>
                  <button onclick="deleteNavItem('left', ${idx})" style="background: rgba(239,68,68,0.2); border: none; color: #f87171; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 11px;" title="Delete">✕</button>
                </div>
              ` : ''}
            </li>
          `).join('')}
          ${!isLocked ? `<li class="nav-add-btn" style="margin-top: 4px;"><button onclick="openAddNavModal('left')" style="width: 100%; padding: 7px; background: rgba(59,130,246,0.15); border: 1px dashed var(--primary); color: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;">+ Add Nav Item</button></li>` : ''}
        </ul>
        <div class="sidebar-controls-section" style="padding: var(--sb-pad);">
          <div class="section-title">${left.controlsTitle}</div>
          <div id="device-badge" class="device-indicator">🖥️ Desk</div>
          <div class="sidebar-controls-group">
            ${left.controls.map(c => {
               let idAttr = c.id ? `id="${c.id}"` : '';
               let icon = c.id === 'lock-btn' ? `<svg viewBox="0 0 24 24" id="lock-svg-icon">${isLocked ? '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>' : '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>'}</svg>` : c.icon;
               let title = c.id === 'lock-btn' ? `<span id="lock-text">${isLocked ? 'Unlock Layout' : 'Lock Layout'}</span>` : `<span>${c.title}</span>`;
               return `<button ${idAttr} onclick="${c.action}" class="sidebar-btn ${c.style||''}" data-tooltip="${c.title}">${icon}${title}</button>`
            }).join('')}
          </div>
        </div>
        <div class="sidebar-footer" style="padding: var(--sb-pad);">
          <img src="${left.profile.img}" class="profile-img" alt="User">
          <div class="profile-info">
            <div class="profile-name">${left.profile.name}</div>
            <div class="profile-role">${left.profile.role}</div>
          </div>
        </div>
      `;

      rightAside.innerHTML = `
        <div class="sidebar-header" style="padding: var(--sb-pad) 10px;">
          <button class="toggle-sidebar-btn" onclick="toggleRightSidebar()" title="Collapse Tools">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="sidebar-logo"><span>${right.header.title}</span></span>
        </div>
        <ul class="sidebar-nav" style="padding: var(--sb-pad);">
          ${right.nav.map((n, idx) => `
            <li style="display: flex; align-items: center; gap: 4px;">
              <a href="#" class="nav-item" data-tooltip="${n.title}" ${n.href ? `onclick="window.open('${n.href}', '_blank'); return false;"` : ''}>
                <span class="nav-icon">${n.icon}</span>
                <span class="nav-text">${n.title}</span>
              </a>
              ${!isLocked ? `
                <div class="nav-edit-actions" style="display: flex; gap: 2px;">
                  <button onclick="openEditNavModal('right', ${idx})" style="background: rgba(255,255,255,0.08); border: none; color: #cbd5e1; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 11px;" title="Edit">✏️</button>
                  <button onclick="deleteNavItem('right', ${idx})" style="background: rgba(239,68,68,0.2); border: none; color: #f87171; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 11px;" title="Delete">✕</button>
                </div>
              ` : ''}
            </li>
          `).join('')}
          ${!isLocked ? `<li class="nav-add-btn" style="margin-top: 4px;"><button onclick="openAddNavModal('right')" style="width: 100%; padding: 7px; background: rgba(59,130,246,0.15); border: 1px dashed var(--primary); color: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;">+ Add Nav Item</button></li>` : ''}
        </ul>
      `;

      const badge = document.getElementById('device-badge');
      if (badge) {
        if (activeDevice === 'mobile') badge.innerText = "📱 Mobile";
        else if (activeDevice === 'tablet') badge.innerText = "📊 Tab";
        else badge.innerText = "🖥️ Desk";
      }
    }

    /* --- DRAG & DROP & RESIZE FUNCTIONALITY --- */
    let isDragging = false;
    let dragEl = null, placeholder = null;
    let offsetX, offsetY;
    let resizingRight = null, resizingBottom = null;
    let resizeStartX = 0, resizeStartY = 0;
    let initialColSpan = 4, initialHeight = 100;

    function getMaxCols() { return activeDevice === 'mobile' ? 4 : (activeDevice === 'tablet' ? 8 : 12); }
    function getCoords(e) { return (e.touches && e.touches.length > 0) ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }

    function checkOverflowStates() {
      document.querySelectorAll('.dynamic-box').forEach(box => {
        if (box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth) box.classList.add('has-overflow');
        else box.classList.remove('has-overflow');
      });
    }

    function handleDragStart(e) {
      if (isLocked || e.target.classList.contains('edit-btn') || e.target.closest('.comp-btn') || e.target.closest('.comp-toggle-btn') || e.target.closest('.comp-onoff-btn') || e.target.closest('input') || e.target.classList.contains('resize-handle-right') || e.target.classList.contains('resize-handle-bottom')) return;
      const el = e.target.closest('.dynamic-box');
      if (!el) return;

      const coords = getCoords(e);
      const rect = el.getBoundingClientRect();
      isDragging = true; dragEl = el; offsetX = coords.x - rect.left; offsetY = coords.y - rect.top;
      
      placeholder = document.createElement('div'); placeholder.className = 'placeholder'; placeholder.style.height = getComputedStyle(el).height;
      const dataItem = layouts[activeDevice].items.find(i => i.id === el.id);
      placeholder.style.gridColumn = `span ${Math.min(dataItem ? dataItem.colSpan : 4, getMaxCols())}`;
      
      el.parentNode.insertBefore(placeholder, el);
      dragEl.classList.add('dragging');
      dragEl.style.left = (coords.x - offsetX) + 'px';
      dragEl.style.top = (coords.y - offsetY) + 'px';
      document.body.classList.add('is-dragging');
    }

    function handleDragMove(e) {
      if (!isDragging || !dragEl || isLocked) return;
      e.preventDefault(); 
      const coords = getCoords(e);
      dragEl.style.left = (coords.x - offsetX) + 'px';
      dragEl.style.top = (coords.y - offsetY) + 'px';

      const hoveredEl = document.elementFromPoint(coords.x, coords.y);
      if (!hoveredEl) return;
      const targetBox = hoveredEl.closest('.dynamic-box:not(.dragging)');
      if (targetBox) {
        const targetRect = targetBox.getBoundingClientRect();
        targetBox.parentNode.insertBefore(placeholder, coords.y < targetRect.top + (targetRect.height / 2) ? targetBox : targetBox.nextSibling);
      } else if (hoveredEl.id === 'app-container' || hoveredEl.tagName === 'MAIN') {
        container.appendChild(placeholder);
      }
    }

    function handleDragEnd() {
      if (isDragging && dragEl && placeholder) {
        placeholder.parentNode.insertBefore(dragEl, placeholder);
        placeholder.remove();
        dragEl.classList.remove('dragging'); dragEl.style.left = ''; dragEl.style.top = '';
        isDragging = false; dragEl = null; placeholder = null;
        document.body.classList.remove('is-dragging');
        saveLayout();
      }
    }

    function initResize(e, elId, direction) {
      if (isLocked) return;
      e.stopPropagation(); e.preventDefault();
      const item = layouts[activeDevice].items.find(i => i.id === elId);
      const coords = getCoords(e);
      if (direction === 'right') { resizingRight = item; resizeStartX = coords.x; initialColSpan = item.colSpan || 4; }
      else if (direction === 'bottom') { resizingBottom = item; resizeStartY = coords.y; initialHeight = parseInt(window.getComputedStyle(document.getElementById(elId)).height) || 2; }
      
      document.addEventListener('mousemove', onResizeMove); document.addEventListener('mouseup', onResizeEnd);
      document.addEventListener('touchmove', onResizeMove, {passive: false}); document.addEventListener('touchend', onResizeEnd);
    }

    function onResizeMove(e) {
      const coords = getCoords(e);
      if (resizingRight) {
        const maxCols = getMaxCols();
        const colWidth = (container.clientWidth - (layouts[activeDevice].gap * (maxCols - 1))) / maxCols;
        let newSpan = Math.max(1, Math.min(maxCols, initialColSpan + Math.round((coords.x - resizeStartX) / colWidth)));
        resizingRight.colSpan = newSpan;
        document.getElementById(resizingRight.id).style.gridColumn = `span ${newSpan}`;
      }
      if (resizingBottom) {
        let newHeight = Math.max(2, initialHeight + (coords.y - resizeStartY));
        resizingBottom.height = newHeight + 'px';
        document.getElementById(resizingBottom.id).style.height = newHeight + 'px';
      }
      checkOverflowStates();
    }

    function onResizeEnd() {
      if (resizingRight || resizingBottom) { saveLayout(); renderUI(); }
      resizingRight = null; resizingBottom = null;
      document.removeEventListener('mousemove', onResizeMove); document.removeEventListener('mouseup', onResizeEnd);
      document.removeEventListener('touchmove', onResizeMove); document.removeEventListener('touchend', onResizeEnd);
    }

    container.addEventListener('mousedown', handleDragStart); container.addEventListener('touchstart', handleDragStart, {passive: false});
    document.addEventListener('mousemove', handleDragMove); document.addEventListener('touchmove', handleDragMove, {passive: false});
    document.addEventListener('mouseup', handleDragEnd); document.addEventListener('touchend', handleDragEnd);

    let currentEditId = null;

    window.openLayoutSettingsModal = function() {
      const currentLayout = layouts[activeDevice];
      document.getElementById('settings-device-name').innerText = activeDevice.charAt(0).toUpperCase() + activeDevice.slice(1);
      
      document.getElementById('setting-gap').value = currentLayout.gap;
      document.getElementById('setting-padding').value = currentLayout.padding;
      document.getElementById('gap-val').innerText = currentLayout.gap;
      document.getElementById('padding-val').innerText = currentLayout.padding;

      document.getElementById('setting-sb-width').value = layouts.leftSidebar.width;
      document.getElementById('setting-sb-padding').value = layouts.leftSidebar.padding;
      document.getElementById('sb-width-val').innerText = layouts.leftSidebar.width;
      document.getElementById('sb-padding-val').innerText = layouts.leftSidebar.padding;

      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('layout-settings-modal').style.display = 'block';
    }

    window.updateGapPreview = function(val) { document.getElementById('gap-val').innerText = val; container.style.gap = val + 'px'; }
    window.updatePaddingPreview = function(val) { document.getElementById('padding-val').innerText = val; document.querySelectorAll('.dynamic-box').forEach(box => box.style.padding = val + 'px'); }
    
    window.updateSbWidthPreview = function(val) {
      document.getElementById('sb-width-val').innerText = val;
      document.getElementById('left-sidebar').style.setProperty('--sidebar-width', val + 'px');
      document.getElementById('right-sidebar').style.setProperty('--sidebar-width', val + 'px');
    }
    
    window.updateSbPaddingPreview = function(val) {
      document.getElementById('sb-padding-val').innerText = val;
      document.getElementById('left-sidebar').style.setProperty('--sb-pad', val + 'px');
      document.getElementById('right-sidebar').style.setProperty('--sb-pad', val + 'px');
    }

    window.executeLayoutCopy = function() {
      const srcDevice = document.getElementById('copy-source-device').value;
      if (srcDevice === activeDevice) { alert("Source and target devices are identical."); return; }
      if (confirm(`Overwrite current '${activeDevice}' layout with '${srcDevice}' layout configuration?`)) {
        layouts[activeDevice] = JSON.parse(JSON.stringify(layouts[srcDevice]));
        saveLayout(); renderUI(); openLayoutSettingsModal();
        alert(`Successfully copied layout from ${srcDevice} to ${activeDevice}!`);
      }
    }

    window.saveLayoutSettings = function() {
      layouts[activeDevice].gap = parseInt(document.getElementById('setting-gap').value) || 0;
      layouts[activeDevice].padding = parseInt(document.getElementById('setting-padding').value) || 0;
      
      layouts.leftSidebar.width = parseInt(document.getElementById('setting-sb-width').value) || 260;
      layouts.rightSidebar.width = parseInt(document.getElementById('setting-sb-width').value) || 260;
      layouts.leftSidebar.padding = parseInt(document.getElementById('setting-sb-padding').value) || 12;
      layouts.rightSidebar.padding = parseInt(document.getElementById('setting-sb-padding').value) || 12;

      saveLayout(); renderUI(); closeAllModals();
    }

    /* --- RECURSIVE COMPONENT EDITING SUPPORT --- */
    function getCompTarget(pathParts, rootComps) {
      let target = rootComps;
      for (let i = 0; i < pathParts.length - 1; i++) {
        target = target[pathParts[i]].components;
      }
      return target;
    }

    window.openEditMenu = function(id) {
      if (isLocked) return;
      currentEditId = id;
      const item = layouts[activeDevice].items.find(i => i.id === id);
      document.getElementById('edit-colspan').value = Math.min(item.colSpan || 4, getMaxCols());
      document.getElementById('edit-colspan').max = getMaxCols();
      document.getElementById('edit-color').value = item.bg;
      renderComponentsEditor();
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('edit-modal').style.display = 'block';
    }

    function renderComponentsEditor() {
      const item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      const listEl = document.getElementById('components-editor-list'); 
      listEl.innerHTML = generateEditorHTML(item.components || [], '');
    }

    function generateEditorHTML(comps, pathPrefix) {
      let html = '';
      comps.forEach((comp, idx) => {
        let currentPath = pathPrefix === '' ? `${idx}` : `${pathPrefix},${idx}`;
        let specificInputs = '';
        
        if (comp.type === 'div') { 
          specificInputs = `
            <div class="full-w"><label>Container Text (Fallback)</label><input type="text" value="${comp.content || ''}" oninput="updateCompProp('${currentPath}', 'content', this.value)"></div>
            <div><label>Background</label><input type="color" value="${comp.bg || '#f8fafc'}" oninput="updateCompProp('${currentPath}', 'bg', this.value)"></div>
            <div class="full-w" style="border: 1px dashed var(--border-color); padding: 8px; border-radius: 6px; margin-top: 6px;">
                <label style="display:block; margin-bottom: 6px;">Nested Components</label>
                <div style="display:flex; flex-direction:column; gap:8px;">
                    ${generateEditorHTML(comp.components || [], currentPath)}
                </div>
                <button type="button" onclick="addComponentRow('${currentPath}')" style="width:100%; margin-top:6px; font-size:11px; padding: 4px;">+ Add Nested Component</button>
            </div>`;
        } 
        else if (comp.type === 'text') { 
          specificInputs = `<div class="full-w"><label>Text Value</label><input type="text" value="${comp.value || ''}" oninput="updateCompProp('${currentPath}', 'value', this.value)"></div><div><label>Font Size</label><input type="text" value="${comp.size || '13px'}" oninput="updateCompProp('${currentPath}', 'size', this.value)"></div><div><label>Text Color</label><input type="color" value="${comp.color || '#0f172a'}" oninput="updateCompProp('${currentPath}', 'color', this.value)"></div><div class="full-w"><label>Position Alignment</label><select onchange="updateCompProp('${currentPath}', 'align', this.value)"><option value="left" ${(comp.align==='left'||!comp.align)?'selected':''}>Left</option><option value="center" ${comp.align==='center'?'selected':''}>Center</option><option value="right" ${comp.align==='right'?'selected':''}>Right</option></select></div>`; 
        } 
        else if (comp.type === 'button') { 
          specificInputs = `<div><label>Button Label</label><input type="text" value="${comp.label || ''}" oninput="updateCompProp('${currentPath}', 'label', this.value)"></div><div><label>Button Color</label><input type="color" value="${comp.color || '#3b82f6'}" oninput="updateCompProp('${currentPath}', 'color', this.value)"></div><div><label>Button Width (%)</label><input type="text" value="${comp.width || '100%'}" placeholder="100% or 50%" oninput="updateCompProp('${currentPath}', 'width', this.value)"></div><div class="full-w"><label>Button OnClick Href</label><input type="text" value="${comp.href || ''}" placeholder="https://..." oninput="updateCompProp('${currentPath}', 'href', this.value)"></div>`; 
        } 
        else if (comp.type === 'toggle-btn') { 
          specificInputs = `<div><label>Toggle Button Label</label><input type="text" value="${comp.label || ''}" oninput="updateCompProp('${currentPath}', 'label', this.value)"></div><div><label>Initial State</label><select onchange="updateCompProp('${currentPath}', 'active', this.value === 'true')"><option value="false" ${!comp.active?'selected':''}>Inactive</option><option value="true" ${comp.active?'selected':''}>Active</option></select></div><div class="full-w"><label>JS Event Code</label><input type="text" value="${comp.onChange || ''}" oninput="updateCompProp('${currentPath}', 'onChange', this.value)"></div>`; 
        } 
        else if (comp.type === 'onoff-group') { 
          specificInputs = `<div><label>On Label</label><input type="text" value="${comp.labelOn || 'On'}" oninput="updateCompProp('${currentPath}', 'labelOn', this.value)"></div><div><label>Off Label</label><input type="text" value="${comp.labelOff || 'Off'}" oninput="updateCompProp('${currentPath}', 'labelOff', this.value)"></div><div class="full-w"><label>Initial State</label><select onchange="updateCompProp('${currentPath}', 'state', this.value)"><option value="on" ${comp.state==='on'?'selected':''}>On Active</option><option value="off" ${comp.state==='off'?'selected':''}>Off Active</option></select></div><div class="full-w"><label>JS Event Code</label><input type="text" value="${comp.onChange || ''}" oninput="updateCompProp('${currentPath}', 'onChange', this.value)"></div>`; 
        } 
        else if (comp.type === 'switch') { 
          specificInputs = `<div class="full-w"><label>Switch Label</label><input type="text" value="${comp.label || ''}" oninput="updateCompProp('${currentPath}', 'label', this.value)"></div><div><label>Initial Checked</label><select onchange="updateCompProp('${currentPath}', 'checked', this.value === 'true')"><option value="false" ${!comp.checked?'selected':''}>Off</option><option value="true" ${comp.checked?'selected':''}>On</option></select></div><div class="full-w"><label>JS Event Code</label><input type="text" value="${comp.onChange || ''}" oninput="updateCompProp('${currentPath}', 'onChange', this.value)"></div>`; 
        } 
        else if (comp.type === 'slider') { 
          specificInputs = `<div class="full-w"><label>Slider Label</label><input type="text" value="${comp.label || ''}" oninput="updateCompProp('${currentPath}', 'label', this.value)"></div><div><label>Min Val</label><input type="number" value="${comp.min !== undefined ? comp.min : 0}" oninput="updateCompProp('${currentPath}', 'min', Number(this.value))"></div><div><label>Max Val</label><input type="number" value="${comp.max !== undefined ? comp.max : 100}" oninput="updateCompProp('${currentPath}', 'max', Number(this.value))"></div><div><label>Initial Val</label><input type="number" value="${comp.value !== undefined ? comp.value : 50}" oninput="updateCompProp('${currentPath}', 'value', Number(this.value))"></div><div class="full-w"><label>JS Event Code</label><input type="text" value="${comp.onChange || ''}" oninput="updateCompProp('${currentPath}', 'onChange', this.value)"></div>`; 
        }

        html += `
        <div class="comp-edit-card" style="${pathPrefix !== '' ? 'padding: 10px; background: #ffffff; border-color:#e2e8f0; margin-bottom: 0;' : ''}">
          <div class="comp-edit-top">
            <select style="flex:1;" onchange="updateCompType('${currentPath}', this.value)">
              <option value="text" ${comp.type==='text'?'selected':''}>Text Block</option>
              <option value="button" ${comp.type==='button'?'selected':''}>Button</option>
              <option value="toggle-btn" ${comp.type==='toggle-btn'?'selected':''}>Toggle Button</option>
              <option value="onoff-group" ${comp.type==='onoff-group'?'selected':''}>On/Off Buttons</option>
              <option value="switch" ${comp.type==='switch'?'selected':''}>Switch Toggle</option>
              <option value="slider" ${comp.type==='slider'?'selected':''}>Slider</option>
              <option value="div" ${comp.type==='div'?'selected':''}>Nested Div</option>
            </select>
            <div style="display:flex; gap:2px;">
                <button type="button" title="Move Up" onclick="moveComponent('${currentPath}', -1)" style="padding:4px 8px;">↑</button>
                <button type="button" title="Move Down" onclick="moveComponent('${currentPath}', 1)" style="padding:4px 8px;">↓</button>
            </div>
            <button type="button" title="Remove" onclick="removeComponentRow('${currentPath}')" class="danger" style="padding:4px 10px;">X</button>
          </div>
          <div class="comp-edit-details">${specificInputs}</div>
        </div>`;
      });
      return html;
    }

    window.addComponentRow = function(parentPath) { 
      let item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      let target = item.components;
      if (parentPath !== 'root') {
        let parts = parentPath.split(',').map(Number);
        for(let i=0; i < parts.length; i++) {
          if (!target[parts[i]].components) target[parts[i]].components = [];
          target = target[parts[i]].components;
        }
      }
      target.push({ type: "text", value: "New Custom Text", color: "#0f172a", size: "13px", align: "left" });
      renderComponentsEditor(); 
    }

    window.removeComponentRow = function(path) { 
      let item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      let parts = path.split(',').map(Number);
      let target = getCompTarget(parts, item.components);
      target.splice(parts[parts.length-1], 1); 
      renderComponentsEditor(); 
    }

    window.moveComponent = function(path, dir) {
      let item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      let parts = path.split(',').map(Number);
      let target = getCompTarget(parts, item.components);
      let idx = parts[parts.length-1];
      if (idx + dir >= 0 && idx + dir < target.length) {
          let temp = target[idx];
          target[idx] = target[idx + dir];
          target[idx + dir] = temp;
          renderComponentsEditor();
      }
    }

    window.updateCompType = function(path, newType) {
      let item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      let parts = path.split(',').map(Number);
      let target = getCompTarget(parts, item.components);
      let idx = parts[parts.length-1];

      if (newType === 'button') target[idx] = { type: 'button', label: 'Action', color: '#3b82f6', width: '100%', href: '' };
      else if (newType === 'toggle-btn') target[idx] = { type: 'toggle-btn', label: 'Toggle', active: false, onChange: '' };
      else if (newType === 'onoff-group') target[idx] = { type: 'onoff-group', labelOn: 'On', labelOff: 'Off', state: 'on', onChange: '' };
      else if (newType === 'switch') target[idx] = { type: 'switch', label: 'Switch', checked: true, onChange: '' };
      else if (newType === 'slider') target[idx] = { type: 'slider', label: 'Slider', min: 0, max: 100, value: 50, onChange: '' };
      else if (newType === 'div') target[idx] = { type: 'div', content: 'Block', bg: '#f8fafc', components: [] };
      else target[idx] = { type: 'text', value: 'Label', color: '#0f172a', size: '13px', align: 'left' };
      renderComponentsEditor();
    }

    window.updateCompProp = function(path, prop, val) { 
      let item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      let parts = path.split(',').map(Number);
      let target = getCompTarget(parts, item.components);
      target[parts[parts.length-1]][prop] = val; 
    }

    window.openAddModal = function() {
      document.getElementById('new-colspan').max = getMaxCols(); document.getElementById('new-colspan').value = Math.min(4, getMaxCols());
      document.getElementById('new-colspan-label').innerText = `Width (Column Span: 1 - ${getMaxCols()})`;
      document.getElementById('modal-overlay').style.display = 'block'; document.getElementById('add-modal').style.display = 'block';
    }

    window.closeAllModals = function() {
      document.getElementById('modal-overlay').style.display = 'none'; 
      document.getElementById('edit-modal').style.display = 'none';
      document.getElementById('add-modal').style.display = 'none'; 
      document.getElementById('layout-settings-modal').style.display = 'none';
      document.getElementById('nav-item-modal').style.display = 'none';
      currentEditId = null; 
      renderUI();
    }

    window.saveEdit = function() {
      if (!currentEditId) return;
      const item = layouts[activeDevice].items.find(i => i.id === currentEditId);
      item.colSpan = Math.min(parseInt(document.getElementById('edit-colspan').value) || 1, getMaxCols()); item.bg = document.getElementById('edit-color').value;
      saveLayout(); renderUI(); closeAllModals();
    }

    window.deleteCurrentWidget = function() {
      if (!currentEditId) return; layouts[activeDevice].items = layouts[activeDevice].items.filter(i => i.id !== currentEditId);
      saveLayout(); renderUI(); closeAllModals();
    }

    window.addWidget = function() {
      layouts[activeDevice].items.push({
        id: 'box_' + Date.now(), colSpan: Math.min(parseInt(document.getElementById('new-colspan').value) || 4, getMaxCols()), height: "170px", bg: document.getElementById('new-color').value,
        components: [ { type: "text", value: "New Widget", color: "#0f172a", size: "14px", align: "left" }, { type: "button", label: "Trigger", color: "#3b82f6", width: "100%", href: "" } ]
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts)); renderUI(); closeAllModals();
    }

    window.toggleLock = function() {
      isLocked = !isLocked; document.body.classList.toggle('locked', isLocked);
      renderSidebars();
      document.querySelectorAll('.edit-btn').forEach(btn => btn.style.display = isLocked ? 'none' : 'block');
    }

    window.exportJSON = function() {
      saveLayout();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(layouts, null, 2));
      const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "advanced_dashboard_with_sidebars.json");
      document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
    }

    window.importJSON = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.desktop && parsed.tablet && parsed.mobile) {
            layouts = parsed; localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts)); renderUI();
          } else alert("Invalid JSON format.");
        } catch (err) { alert("Error parsing JSON file."); }
      };
      reader.readAsText(file); event.target.value = '';
    }

    /* --- RECURSIVE HTML COMPONENT BUILDER --- */
    function buildComponentsHTML(comps) {
      if (!comps) return '';
      let html = '';
      comps.forEach(comp => {
        if (comp.type === 'text') html += `<div class="comp-text" style="color: ${comp.color || '#0f172a'}; font-size: ${comp.size || '13px'}; text-align: ${comp.align || 'left'};">${comp.value || ''}</div>`;
        else if (comp.type === 'button') html += `<button class="comp-btn" style="background-color: ${comp.color || '#3b82f6'}; color: #ffffff; width: ${comp.width || '100%'};" ${comp.href ? `onclick="window.open('${comp.href}', '_blank')"` : `onclick="alert('Action: ${comp.label}')"`}>${comp.label || 'Button'}</button>`;
        else if (comp.type === 'toggle-btn') html += `<button class="comp-toggle-btn ${comp.active ? 'active' : ''}" onclick="this.classList.toggle('active'); let active = this.classList.contains('active'); ${comp.onChange || ''}">${comp.label || 'Toggle'}</button>`;
        else if (comp.type === 'onoff-group') html += `<div class="comp-onoff-group"><button class="comp-onoff-btn ${comp.state === 'on' ? 'on-active' : ''}" onclick="let g = this.parentElement; g.querySelector('.off-active')?.classList.remove('off-active'); this.classList.add('on-active'); let state='on'; ${comp.onChange || ''}">${comp.labelOn || 'On'}</button><button class="comp-onoff-btn ${comp.state === 'off' ? 'off-active' : ''}" onclick="let g = this.parentElement; g.querySelector('.on-active')?.classList.remove('on-active'); this.classList.add('off-active'); let state='off'; ${comp.onChange || ''}">${comp.labelOff || 'Off'}</button></div>`;
        else if (comp.type === 'switch') html += `<div class="comp-switch-wrapper"><span>${comp.label || 'Switch'}</span><label class="switch"><input type="checkbox" ${comp.checked ? 'checked' : ''} onchange="let checked = this.checked; ${comp.onChange || ''}"><span class="slider-switch"></span></label></div>`;
        else if (comp.type === 'slider') html += `<div class="comp-slider-group"><span>${comp.label || 'Slider'}: <strong class="slider-val">${comp.value !== undefined ? comp.value : 50}</strong></span><input type="range" min="${comp.min !== undefined ? comp.min : 0}" max="${comp.max !== undefined ? comp.max : 100}" value="${comp.value !== undefined ? comp.value : 50}" oninput="this.previousElementSibling.querySelector('.slider-val').innerText = this.value; ${comp.onChange || ''}"></div>`;
        else if (comp.type === 'div') {
          html += `<div class="comp-nested-div" style="background-color: ${comp.bg || '#f8fafc'};">`;
          if (comp.components && comp.components.length > 0) {
            html += buildComponentsHTML(comp.components);
          } else {
            html += (comp.content || ''); 
          }
          html += `</div>`;
        }
      });
      return html;
    }

    function renderUI() {
      renderSidebars();

      container.innerHTML = "";
      const currentLayout = layouts[activeDevice];
      const maxCols = getMaxCols();
      container.style.gap = currentLayout.gap + 'px';

      currentLayout.items.forEach(item => {
        const el = document.createElement('div'); el.id = item.id; el.className = "dynamic-box";
        el.style.gridColumn = `span ${Math.min(item.colSpan || 4, maxCols)}`;
        el.style.height = item.height; el.style.backgroundColor = item.bg; el.style.padding = currentLayout.padding + 'px';

        let componentsHTML = item.components ? buildComponentsHTML(item.components) : '';

        el.innerHTML = `<button class="edit-btn" style="display: ${isLocked ? 'none' : 'block'}" onclick="openEditMenu('${item.id}')">Configure</button><div class="widget-content-container">${componentsHTML}</div><div class="overflow-arrow">▼</div><div class="resize-handle-right" onmousedown="initResize(event, '${item.id}', 'right')" ontouchstart="initResize(event, '${item.id}', 'right')"></div><div class="resize-handle-bottom" onmousedown="initResize(event, '${item.id}', 'bottom')" ontouchstart="initResize(event, '${item.id}', 'bottom')"></div>`;
        container.appendChild(el);
      });
      setTimeout(checkOverflowStates, 50);
    }

    window.saveLayout = function() {
      let newLayoutArray = [];
      document.querySelectorAll('#app-container > .dynamic-box').forEach(box => {
        let existingData = layouts[activeDevice].items.find(d => d.id === box.id);
        if (existingData) { existingData.height = box.style.height; newLayoutArray.push(existingData); }
      });
      layouts[activeDevice].items = newLayoutArray;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts));
    }

    window.clearStorage = function() {
      if (confirm("Reset all layouts & sidebars back to defaults?")) {
        localStorage.removeItem(STORAGE_KEY);
        layouts = JSON.parse(JSON.stringify(defaultMultiLayouts));
        renderUI();
      }
    }

    function checkDeviceChange() {
      const newDevice = getDeviceMode();
      if (newDevice !== activeDevice) {
        saveLayout(); activeDevice = newDevice;
        document.body.className = isLocked ? 'locked' : '';
        document.body.classList.add('device-' + activeDevice);
        if (isLocked) document.body.classList.add('locked');
        renderUI();
      }
    }

    document.body.classList.add('device-' + activeDevice);
    document.body.classList.add('locked');

    window.addEventListener('resize', () => { checkDeviceChange(); checkOverflowStates(); });
    
    renderUI();
  </script>
</body>
</html>
